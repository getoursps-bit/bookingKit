# Local development services. Run the app itself on the host with `pnpm dev`.
#   docker compose -f docker/compose.dev.yml up -d
# Image storage uses the in-memory fake locally (PROVIDERS=fake), so no S3
# service runs here.
name: bookingkit
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5435:5432"
    volumes:
      - ./dev-init:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
