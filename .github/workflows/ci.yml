name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        # The default client; a second one with another name, palette, fonts
        # and languages; and a plain one with no extensions, so nothing
        # quietly depends on the default or on an extension being on.
        client: [client.json, tests/fixtures/client.sample.json, tests/fixtures/client.plain.json]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-retries 10
    env:
      APP_BASE_URL: http://localhost:3000
      SESSION_SECRET: ci-only-secret-ci-only-secret-0000
      PROVIDERS: fake
      DATABASE_URL: postgres://app_user:app-dev@localhost:5432/postgres
      TEST_ADMIN_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Use the second client
        if: matrix.client != 'client.json'
        run: cp "${{ matrix.client }}" client.json && pnpm brand
      - name: Prepare database (same as docker/dev-init)
        run: psql postgres://postgres:postgres@localhost:5432/postgres -f docker/dev-init/01-schema.sql
      - name: Migrate and seed as the app role, twice to prove both are repeatable
        run: pnpm migrate && pnpm seed && pnpm migrate && pnpm seed && pnpm migrate --check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: The bundled scripts start (native modules load from node_modules)
        run: |
          node worker/dist/staff-create.js 2>&1 | grep -q "Usage:"
          node worker/dist/import-dibs.js 2>&1 | grep -q "Usage:"
      - name: End-to-end tests (phone screen, axe, booking flow)
        run: pnpm exec playwright install --with-deps chromium && pnpm test:e2e
      - name: Dependency scan
        run: pnpm audit --prod --audit-level high

  image:
    needs: check
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - name: Image name (the repository, in lower case, as the registry requires)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}:${GITHUB_SHA}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          # Loaded first and pushed only after the smoke test below.
          load: true
          # Immutable tag only: the commit SHA. Never `latest`.
          tags: ${{ env.IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Every script in the image starts
        run: |
          for script in staff-create import-dibs; do
            docker run --rm --entrypoint node "$IMAGE" "worker/$script.js" 2>&1 | grep -q "Usage:"
          done
          # Without DATABASE_URL these stop at the config check, after every import loaded.
          for script in main migrate seed; do
            out=$(docker run --rm --entrypoint node "$IMAGE" "worker/$script.js" 2>&1 || true)
            if echo "$out" | grep -qE "ReferenceError|ERR_MODULE_NOT_FOUND|Cannot find module|ERR_DLOPEN"; then
              echo "$out"; exit 1
            fi
          done
      - name: Push
        run: docker push "$IMAGE"
